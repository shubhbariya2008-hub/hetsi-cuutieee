<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Why Hetsi Only?</title>

<style>
*{
  margin:0;
  padding:0;
  box-sizing:border-box;
  font-family:'Segoe UI', sans-serif;
}

body{
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#1a0f2e,#3a0f3f,#5c1a4d);
  overflow:hidden;
  color:white;
}

/* soft floating pink dots */
body::before{
  content:"";
  position:absolute;
  width:200%;
  height:200%;
  background:radial-gradient(circle,rgba(255,105,180,0.15) 2px,transparent 2px);
  background-size:40px 40px;
  animation:move 25s linear infinite;
}

@keyframes move{
  from{transform:translate(0,0);}
  to{transform:translate(-200px,-200px);}
}

.wrapper{
  position:relative;
  width:90%;
  max-width:650px;
  text-align:center;
  z-index:2;
}

.card{
  position:relative;
  background:rgba(255,255,255,0.07);
  backdrop-filter:blur(15px);
  border:1px solid rgba(255,182,193,0.4);
  border-radius:20px;
  padding:30px;
  height:380px;
  display:flex;
  flex-direction:column;
  justify-content:space-between;
}

.label{
  position:absolute;
  top:15px;
  left:20px;
  font-size:14px;
  color:#ffb6d9;
  text-shadow:0 0 8px #ff69b4;
  letter-spacing:1px;
}

.text{
  margin-top:35px;
  font-size:17px;
  line-height:1.7;
  font-style:italic;
  overflow-y:auto;
  padding-right:8px;
}

button{
  margin-top:15px;
  padding:10px 22px;
  border:none;
  border-radius:25px;
  background:#ff69b4;
  color:white;
  cursor:pointer;
  font-size:14px;
  transition:0.3s;
}

button:hover{
  background:#ff85c1;
  transform:scale(1.05);
}

.hidden{
  display:none;
}
</style>
</head>

<body>

<div class="wrapper">
  <div class="card">
    <div class="label" id="label"></div>
    <div class="text" id="text"></div>
    <button id="btn">Yes</button>
  </div>
</div>

<script>

const screens = [

/* SCREEN 1 */
{
label:"",
text:"You always ask me that why not anyone else, why Hetsi only. So today… are you ready to know the answer?",
button:"Yes"
},

/* REASON 1 */
{
label:"Reason 1 – Your Eyes",
text:`Your eyes are so much pretty that whenever I just see into it, I just get lost. I can't see anything other than your eyes. They are just that deep, even the sea is not deeper than them. Whenever I look into your eyes in any situation, I feel a different type of relief and love in it.`,
button:"Next"
},

/* REASON 2 */
{
label:"Reason 2 – Your Expressions",
text:`The way your expressions are, I can never explain it properly. The way you talk, the way you smile, the way you see, the way you interact — everything feels so cute. My personal favorite is your innocent nature, your polite nature, and your expressions while talking with me. The way you smile slightly and blush slightly… you are truly a certified expression queen.`,
button:"Next"
},

/* REASON 3 */
{
label:"Reason 3 – Your Hair",
text:`I know everyone has hair, but the soft curls that fall on your face and the way your hair blows in the air, and when you fix it gently… that makes your hair really unique from others.`,
button:"Next"
},

/* REASON 4 */
{
label:"Reason 4 – Your Heart",
text:`Your heart is also as much pretty as you. The way you understand my talks, the way you understand my feelings for you, and the way you care that I should not be hurt — that is rare. The way you talk with kindness and your soft nature makes me trust you deeply. Your politeness and your understanding reflect in everything you do.`,
button:"Next"
},

/* REASON 5 */
{
label:"Reason 5 – Simply You",
text:`Simply because you are you. A boy needs someone who understands him, and you truly understand me. Not just understanding, but you have every beautiful thing in you. When you speak, your soft and sweet voice feels like it whispers peace in my ears. Your cute smile, your pretty eyes, your expressions, your hair — everything. I don't love you because you are perfect. I love you because you are you. And when I am with you, my heart feels safe, peaceful, and happy.`,
button:"One last thing…"
},

/* FINAL */
{
label:"",
text:`Not better than others. Not compared to anyone. Just you. And that is more than enough for my heart.`,
button:""
}

];

let current = 0;
const textEl = document.getElementById("text");
const btn = document.getElementById("btn");
const label = document.getElementById("label");

function typeWriter(content, callback){
  textEl.innerHTML="";
  let i=0;
  function typing(){
    if(i<content.length){
      textEl.innerHTML+=content.charAt(i);
      i++;
      setTimeout(typing,30);
    }else{
      if(callback) callback();
    }
  }
  typing();
}

function showScreen(){
  const screen = screens[current];
  label.textContent = screen.label || "";
  typeWriter(screen.text);

  if(current < screens.length-1){
    btn.textContent = screen.button;
    btn.classList.remove("hidden");
  }else{
    btn.classList.add("hidden");
  }
}

btn.addEventListener("click",()=>{
  if(current < screens.length-1){
    current++;
    showScreen();
  }
});

showScreen();

</script>

</body>
</html>
